<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Cancer Protocol Dashboard — Real Metrics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060A14;--s1:#0B0F1A;--s2:#111827;--bd:#1e293b;--tx:#e2e8f0;--dim:#94a3b8;--mut:#64748b;
--grn:#22c55e;--blu:#60a5fa;--pur:#a78bfa;--pnk:#f472b6;--yel:#fbbf24;--red:#ef4444;--amb:#eab308;--ind:#818cf8;
--brca:#F472B6;--luad:#60A5FA;--crc:#4ADE80;--stad:#FBBF24}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI','Noto Sans KR',system-ui,sans-serif;min-height:100vh;font-size:13px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin-bottom:16px}
.hdr h1{font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,var(--ind),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{font-size:.72rem;color:var(--mut);margin-top:2px}
.ver{font-size:.68rem;color:var(--ind);background:rgba(129,140,248,.1);padding:3px 10px;border-radius:12px;border:1px solid rgba(129,140,248,.2)}
.hdr-rag{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.rag-chat-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid rgba(96,165,250,.45);background:rgba(96,165,250,.14);color:var(--blu);font-size:.74rem;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer}
.rag-chat-btn:hover{background:rgba(96,165,250,.24)}
.rag-badge-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:380px}
.rag-mini{font-size:.58rem;padding:2px 7px;border-radius:8px;font-weight:600}
.ov-dis-title{font-size:.9rem;font-weight:800;margin-bottom:6px}
.ov-dis-sub{font-size:.72rem;color:var(--dim);line-height:1.65;margin-bottom:12px}
.ov-pick-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ov-pick{padding:10px 18px;border-radius:12px;border:1px solid var(--bd);cursor:pointer;font-weight:700;font-size:.78rem;background:rgba(255,255,255,.03);color:var(--dim)}
.ov-pick:hover{border-color:rgba(96,165,250,.35)}
.ov-pick.active{border-color:rgba(96,165,250,.55);background:rgba(96,165,250,.12);color:var(--blu)}
.ov-sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.ov-trace{font-size:.68rem;color:var(--dim);line-height:1.6}
.ov-table-wrap{overflow:auto;border:1px solid var(--bd);border-radius:12px;margin-top:8px}
.ov-table{font-size:.62rem}
.ov-table th,.ov-table td{padding:6px 8px;border-bottom:1px solid rgba(30,41,59,.6);white-space:nowrap}
.ov-table th{position:sticky;top:0;background:var(--s2);z-index:1}
.ov-row-c2{background:rgba(167,139,250,.1)!important}
.ov-row-c3{background:rgba(52,211,153,.1)!important}
.ov-row-c1{background:rgba(251,191,36,.07)!important}
.ov-row-man{background:rgba(248,113,113,.06)!important}
.ov-row-pend{background:rgba(129,140,248,.08)!important}
.bdg-c2{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.58rem;font-weight:800;background:rgba(167,139,250,.2);color:var(--pur);border:1px solid rgba(167,139,250,.35)}
.bdg-c3{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.58rem;font-weight:800;background:rgba(52,211,153,.2);color:#34d399;border:1px solid rgba(52,211,153,.35)}
.bdg-c1{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.58rem;font-weight:700;background:rgba(251,191,36,.15);color:var(--amb);border:1px solid rgba(251,191,36,.3)}
.bdg-man{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.58rem;font-weight:700;background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.bdg-pend{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.58rem;font-weight:700;background:rgba(129,140,248,.15);color:var(--ind);border:1px solid rgba(129,140,248,.25)}
.bdg-repur{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.58rem;font-weight:800;background:rgba(244,114,182,.15);color:var(--pnk);border:1px solid rgba(244,114,182,.35)}

/* Cancer pills */
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .2s;background:transparent;color:var(--dim)}
.pill.active{border-color:currentColor;transform:scale(1.05)}
.pill:hover{opacity:.9}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:rgba(255,255,255,.02);padding:4px;border-radius:12px;border:1px solid rgba(255,255,255,.05);overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.75rem;font-weight:500;color:var(--mut);white-space:nowrap;transition:all .2s;border:none;background:none}
.tab.active{background:rgba(255,255,255,.1);color:white}
.tab:hover{color:var(--dim)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.kpi .v{font-size:1.1rem;font-weight:700;font-family:'Courier New',monospace}
.kpi .l{font-size:.65rem;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
/* Card */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{font-size:.85rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
/* Table */
table{width:100%;border-collapse:collapse;font-size:.72rem}
th{text-align:left;padding:8px 10px;color:var(--mut);font-weight:500;border-bottom:1px solid var(--bd);white-space:nowrap}
th.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid rgba(30,41,59,.5);font-family:'Courier New',monospace}
td.r{text-align:right}
td.c{text-align:center}
tr:hover td{background:rgba(255,255,255,.015)}
tr.best td{background:rgba(34,197,94,.06)}
.best-name{color:var(--grn);font-weight:700}
/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:600}
.badge-grn{background:rgba(34,197,94,.12);color:var(--grn)}
.badge-amb{background:rgba(234,179,8,.12);color:var(--amb)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red)}
.badge-blu{background:rgba(96,165,250,.12);color:var(--blu)}
.badge-gray{background:rgba(100,116,139,.12);color:var(--mut)}
/* Step buttons */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.step-btn{padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.05);cursor:pointer;font-size:.72rem;font-weight:500;color:var(--dim);background:transparent;display:flex;align-items:center;gap:6px;transition:all .15s}
.step-btn.active{color:white;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.step-btn:hover{border-color:rgba(255,255,255,.15)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-grn{background:var(--grn)}.dot-amb{background:var(--amb)}.dot-blu{background:var(--blu);animation:pulse 2s infinite}.dot-gray{background:var(--mut)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Eval/Track selectors */
.sel{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sel-label{font-size:.68rem;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:.5px}
.sel-btn{padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.05);font-size:.7rem;font-family:'Courier New',monospace;color:var(--dim);cursor:pointer;background:transparent}
.sel-btn.active{background:rgba(255,255,255,.1);color:white;border-color:rgba(255,255,255,.2)}
/* Gate */
.gate{padding:16px 18px;border-radius:14px;border:1px solid rgba(34,197,94,.15);background:linear-gradient(135deg,rgba(34,197,94,.04),rgba(96,165,250,.04));margin-bottom:14px}
.gate h3{color:var(--grn);font-size:.85rem;margin-bottom:8px}
.gate p{font-size:.72rem;color:var(--dim);line-height:1.7;padding-left:14px;position:relative}
.gate p::before{content:'→';position:absolute;left:0;color:var(--grn)}
/* Warning */
.warn{padding:12px 16px;border-radius:12px;background:rgba(234,179,8,.06);border:1px solid rgba(234,179,8,.15);font-size:.72rem;color:var(--amb);display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
/* Primary metric highlight */
.primary{color:var(--amb) !important;font-weight:700 !important}
/* Responsive */
@media(max-width:768px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.kpis{grid-template-columns:repeat(2,1fr)}table{font-size:.65rem}th,td{padding:5px 6px}}
/* Global summary (final / Neo4j / RAG) */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}
.sum-table{font-size:.72rem;width:100%}
.sum-table td,.sum-table th{padding:6px 8px;border-bottom:1px solid rgba(30,41,59,.5)}
.sum-table th{color:var(--mut);font-weight:500;text-align:left}
.sum-table td.r{text-align:right;font-family:'Courier New',monospace}
.sum-list{margin:0;padding-left:16px;font-size:.72rem;color:var(--dim);line-height:1.85}
.sum-list li{margin-bottom:3px}
.card .sum-note{font-size:.65rem;color:var(--mut);margin-top:10px;line-height:1.55;border-top:1px solid rgba(30,41,59,.6);padding-top:8px}


/* Pipeline / KG mini diagram */
.kg-wrap{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:10px;align-items:start}
@media(max-width:980px){.kg-wrap{grid-template-columns:1fr}}
.kg-col{background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kg-title{font-size:.68rem;color:var(--mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.kg-node{margin:6px 0;padding:8px 10px;border-radius:10px;font-size:.68rem;font-weight:600;border:1px solid var(--bd);text-align:center}
.kg-n-cand{background:rgba(96,165,250,.12);color:var(--blu)}
.kg-n-drug{background:rgba(34,197,94,.12);color:var(--grn)}
.kg-n-can{background:rgba(244,114,182,.12);color:var(--pnk)}
.kg-n-tgt{background:rgba(167,139,250,.12);color:var(--pur)}
.kg-n-moa{background:rgba(251,191,36,.12);color:var(--yel)}
.kg-n-resp{background:rgba(56,189,248,.12);color:#38bdf8}
.kg-n-adm{background:rgba(249,115,22,.12);color:#fb923c}
.kg-n-str{background:rgba(236,72,153,.12);color:#ec4899}
.kg-n-cat{background:rgba(129,140,248,.12);color:var(--ind)}
.kg-edge{font-size:.62rem;color:var(--dim);padding:4px 0;border-bottom:1px dashed rgba(30,41,59,.5)}
.kg-flow{font-size:.65rem;color:var(--dim);line-height:1.55}
.kg-linkbtn{display:inline-block;margin-top:10px;padding:8px 12px;border-radius:10px;border:1px solid rgba(96,165,250,.35);color:var(--blu);font-size:.68rem;text-decoration:none}
.kg-linkbtn:hover{background:rgba(96,165,250,.08)}
/* Step8/9 KG + RAG mock (2026-04-26) */
.step-anchor-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.02)}
.step-anchor-nav a{font-size:.68rem;color:var(--blu);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid rgba(96,165,250,.25);background:rgba(96,165,250,.06)}
.step-anchor-nav a:hover{background:rgba(96,165,250,.12)}
.kg-schema-wrap{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:start}
@media(max-width:900px){.kg-schema-wrap{grid-template-columns:1fr}}
.kg-badge-grid{display:flex;flex-direction:column;gap:8px}
.kg-badge{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.03);font-size:.65rem}
.kg-badge b{font-family:'Courier New',monospace;color:var(--tx)}
.kg-svg-panel{width:100%;max-height:360px;border-radius:12px;border:1px solid var(--bd);background:#070d18}
.kg-svg-panel svg{width:100%;height:auto;display:block}
.mini-kg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mini-kg-card{border:1px solid var(--bd);border-radius:12px;padding:12px;background:rgba(255,255,255,.02)}
.mini-kg-card h4{font-size:.78rem;margin:0 0 8px 0;color:var(--pnk)}
.mini-kg-flow{font-size:.62rem;color:var(--dim);line-height:1.65;font-family:system-ui,sans-serif}
.mini-kg-flow .n{display:inline-block;padding:2px 6px;border-radius:6px;margin:1px;font-weight:600;font-size:.58rem}
.mini-kg-flow .arr{color:var(--mut);margin:0 2px}
.pl-view-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pl-view-card{border:1px solid rgba(96,165,250,.25);border-radius:12px;padding:14px;background:rgba(96,165,250,.04)}
.pl-iframe-wrap{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:#000;min-height:220px}
.pl-iframe-wrap iframe{width:100%;height:220px;border:0;background:#000}
.pill-bar{margin:6px 0}
.pill-bar .row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.62rem}
.pill-bar .lab{min-width:180px;color:var(--dim);flex:0 0 auto}
.pill-bar .track{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.pill-bar .fill{height:100%;border-radius:6px}
.appl-mini-table{font-size:.62rem;width:100%;margin-top:10px}
.appl-mini-table th,.appl-mini-table td{padding:5px 6px;border-bottom:1px solid rgba(30,41,59,.5)}
.rag-mock{display:grid;grid-template-columns:220px 1fr;gap:12px}
@media(max-width:800px){.rag-mock{grid-template-columns:1fr}}
.rag-qlist{display:flex;flex-direction:column;gap:6px}
.rag-qbtn{text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);font-size:.65rem;cursor:pointer}
.rag-qbtn:hover{border-color:rgba(96,165,250,.35)}
.rag-out{min-height:180px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.25);font-size:.68rem;line-height:1.6;color:var(--dim)}
.rag-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.rag-askbtn{padding:8px 14px;border-radius:10px;border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.1);color:var(--pur);font-size:.68rem;cursor:pointer}
.flow-arch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:14px;border-radius:12px;border:1px dashed rgba(96,165,250,.25);background:rgba(96,165,250,.04);font-size:.65rem;color:var(--dim)}
.flow-arch .box{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.04);font-weight:600;color:var(--tx)}
.flow-arch .arr{color:var(--mut)}
/* Step7/8 Streamlit-style + KG interactive */
.sl-banner{border-radius:12px}
.kg-int-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(220px,.85fr);gap:12px;align-items:start}
@media(max-width:960px){.kg-int-wrap{grid-template-columns:1fr}}
.kg-int-svg{border-radius:12px;border:1px solid var(--bd);background:#070d18;padding:8px}
.kg-hit{cursor:pointer}
.kg-hit:hover{filter:brightness(1.2)}
.kg-detail-panel{min-height:220px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.22);font-size:.68rem;line-height:1.55;color:var(--dim)}
.kg-path-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.kg-path-sm{border:1px solid var(--bd);border-radius:10px;padding:10px;background:rgba(255,255,255,.02);font-size:.62rem;line-height:1.55;color:var(--dim)}
.kg-global-badge{font-size:.62rem;color:var(--mut);padding:6px 10px;border-radius:8px;border:1px dashed rgba(148,163,184,.35);display:inline-block;margin:4px 4px 4px 0}
.rag-jump a{font-size:.62rem;color:var(--blu);margin-right:10px}
/* Within-cancer duplicate display */
.dup-card{border-radius:12px;border:1px solid rgba(234,179,8,.35);background:rgba(234,179,8,.06);padding:12px 14px;margin-bottom:12px}
.dup-card h4{margin:0 0 6px 0;font-size:.78rem;color:var(--amb)}
.dup-group{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin-bottom:8px;background:rgba(15,23,42,.45)}
.dup-group summary{cursor:pointer;font-size:.72rem;font-weight:650;color:var(--dim);list-style-position:outside}
.dup-badge{font-size:.58rem;padding:1px 6px;border-radius:6px;border:1px solid rgba(234,179,8,.4);color:var(--amb);margin-left:6px}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="dashboard_audit_bundle.js"></script>
<script src="dashboard_cosmic_integration_bundle.js"></script>
<script src="dashboard_cosmic_aware_step6_bundle.js"></script>
<script src="dashboard_gdsc1_only_step6_bundle.js"></script>
<script src="dashboard_step6_review_consolidation_bundle.js"></script>
<script src="dashboard_final_v2_bundle.js"></script>
<script src="dashboard_final_v2_1_category_audit_bundle.js"></script>
<script src="dashboard_final_v2_2_category_allowlist_bundle.js"></script>
<script src="dashboard_ensemble_traceability_bundle.js"></script>
<script src="dashboard_overview_diseasewise_candidates_bundle.js"></script>
<script src="dashboard_positive_control_recovery_bundle.js"></script>
<script src="dashboard_positive_control_allowlist_expansion_bundle.js"></script>
<script src="dashboard_ensemble_candidate_summary_bundle.js"></script>
<script src="dashboard_step5_selection_metric_audit_bundle.js"></script>

<script src="dashboard_groupcv_v3_final_readiness_bundle.js"></script>
<script src="dashboard_groupcv_v3_drug_name_curation_bundle.js"></script>
<script src="dashboard_groupcv_v3_promotion_readiness_bundle.js"></script>
<script src="dashboard_groupcv_v3_top30_candidate_review_bundle.js"></script>
<script src="dashboard_v4_ic50_bundle.js"></script>
<script src="dashboard_step7_three_tier_bundle.js"></script>

function withinCancerDupKey(row){

function withinCancerDupAuditFromRows(rows){
  const buckets={};
  (rows||[]).forEach(r=>{
    const g=withinCancerDupKey(r).groupId;
    if(!buckets[g]) buckets[g]=[];
    buckets[g].push(r);
  });
  const keys=Object.keys(buckets);
  const dupKeys=keys.filter(k=>buckets[k].length>1);
  const dupNames=dupKeys.map(k=>{
    const names=[...new Set(buckets[k].map(x=>String(x.drug_name||"").trim()||"(empty name)"))];
    return names.join("|")+" (n="+buckets[k].length+")";
  });
  return{
    raw:(rows||[]).length,
    unique:keys.length,
    dupDrugCount:dupKeys.length,
    dupNames:dupNames.join("; "),
    keyType:dupKeys.length?withinCancerDupKey(buckets[dupKeys[0]][0]).keyType:"none",
    buckets
  };
}

function collapsibleDupGroupedTable(title, cols, rows, rankKey){

    const head=grp[0]||{};

    h+=`<div style="overflow:auto;max-width:100%"><table class="sum-table"><thead><tr>`;
    cols.forEach(c=>{h+=`<th>${c.lab}</th>`;});

      cols.forEach(c=>{h+=`<td style="font-size:.65rem;word-break:break-word">${escPE(row[c.key])}</td>`;});

function enrichStep6InterpretationRow(r){
  const parseF=x=>{const v=parseFloat(String(x===undefined||x===null?"":x).trim());return isNaN(v)?null:v;};
  const respSt=(v)=>{const n=parseF(v); if(n===null)return"missing_or_not_mapped"; if(n===0)return"weak_support"; return"supportive";};
  const ctrp=String(r.ctrp_partial_flag||"").toLowerCase();
  const ctrpSt=(ctrp==="true"||ctrp==="1")?"partial_only":"missing_or_not_mapped";
  const clin=parseF(r.clinical_trial_evidence); const clinSt=clin===null?"missing_or_not_mapped":(clin===0?"weak_support":"supportive");
  const chem=String(r.chembl_or_target_evidence||"").trim();
  const chemSt=(!chem||chem==="0")?"missing_or_not_mapped":"supportive";
  let nResp=0;
  if(respSt(r.gdsc_score)==="supportive") nResp++;
  if(respSt(r.prism_score)==="supportive") nResp++;
  if(ctrpSt==="partial_only") nResp++;
  let caveat_type="none", caveat_interpretation="No row-level caveat text in embed.";
  const cav=String(r.caveat||"");
  if(cav.indexOf("Graph component is partial")>=0){caveat_type="luad_graph_partial"; caveat_interpretation="LUAD graph modality incomplete — modality caveat, not per-source true failure.";}
  else if(cav&&cav.toLowerCase()!=="false"){caveat_type="mapping_review_required"; caveat_interpretation=cav.slice(0,220);}
  const ctrpNote=ctrpSt==="partial_only"?"CTRP partial evidence only (not full dose–response)":"—";
  const CB=cosmicBundle();
  const ck=String(r.cancer||r.cancer_type||"").toLowerCase();
  const cid=String(r.canonical_drug_id||"").trim();
  const hit=(CB.byKey||{})[`${ck}|${cid}`]||{};
  const hasByKey=CB.byKey&&Object.keys(CB.byKey).length>0;
  const hasHit=hasByKey&&hit&&Object.keys(hit).length>0;
  let cosmicStatus, cosmicScore, cosmicInterp, cosmicGeneEv;
  if(hasHit){
    cosmicStatus=String(hit.cosmic_status||"missing_or_not_mapped");
    cosmicScore=String(hit.cosmic_target_relevance_score||"missing_or_not_available");
    cosmicInterp=String(hit.cosmic_interpretation||"");
    cosmicGeneEv=String(hit.cosmic_gene_cancer_evidence||"");
  }else if(!hasByKey){
    cosmicStatus="source_not_available";
    cosmicScore="missing_or_not_available";
    cosmicInterp="COSMIC integration bundle not loaded. Serve dashboard_cosmic_integration_bundle.js next to this HTML (see next_stage_cosmic_integration/). Not drug-response evidence; EV composite unchanged.";
    cosmicGeneEv="—";
  }else{
    cosmicStatus="missing_or_not_mapped";
    cosmicScore="missing_or_not_available";
    cosmicInterp="No COSMIC preflight row for this cancer|canonical_drug_id key (regenerate build_cosmic_integration_preflight.py if cohort changed).";
    cosmicGeneEv="—";
  }
  return Object.assign({},r,{
    gdsc_status:respSt(r.gdsc_score),
    prism_status:respSt(r.prism_score),
    ctrp_status:ctrpSt,
    clinical_trial_status:clinSt,
    chembl_status:chemSt,
    cosmic_status:cosmicStatus,
    cosmic_target_relevance_score:cosmicScore,
    cosmic_evidence_score:cosmicScore,
    cosmic_target_relevance:cosmicScore,
    cosmic_mutation_or_gene_evidence:hasHit?(cosmicGeneEv||"preflight_stub_not_official_cosmic_table"):"—",
    cosmic_interpretation:cosmicInterp,
    external_response_source_count:String(nResp),
    ev_selection_reason:String(r.selected_reason||"")==="True"?"Composite EV met selection threshold (selected_reason=True)":"Held in Top15 without selection flag=True (still part of fixed Top15 cohort).",
    ctrp_partial_note:ctrpNote,
    caveat_type,
    caveat_interpretation
  });
}

function enrichL15WithCanonicalDrugId(L15, cancerSel){
  const P=PIPELINE_EMBED;
  const t6=filterRowsByCancer(P.step6_top15_display||P.step6_top15||[],"cancer", cancerSel);
  const m=new Map();
  t6.forEach(r=>{
    const k=normalizeDrugName(r.drug_name);
    if(!k) return;
    const id=String(r.canonical_drug_id||"").trim();
    if(!id) return;
    const cur=m.get(k)||"";

    m.set(k, parts.join(";"));
  });
  return (L15||[]).map(r=>{const k=normalizeDrugName(r.drug_name); return Object.assign({}, r, {canonical_drug_id:m.get(k)||""});});

  const isNew=String(r.change_status||"").indexOf("added")>=0||String(r.change_status||"").indexOf("replacement")>=0;
  const v21=String(r.drug_repurposing_category_v2_1||"");
  const v22=String(r.drug_repurposing_category_v2_2||"");
  const v2c=String(r.drug_repurposing_category_v2||"");
  const recl=String(v21)!==String(v22);
  const hit=String(r.current_use_allowlist_hit||"").toLowerCase()==="true";
  const badge=String(r.same_cancer_evidence_badge||"");
  let flags=(pend?"pending ":"")+(isNew?"v2_new ":"")+(recl?"reclassified ":"");
  flags+=v22==="current_use_same_cancer"?(hit?"same_cancer_evidence:yes ":"same_cancer_evidence:no "):"same_cancer_evidence:n_a ";
  flags+=hit?"allowlist_hit ":"";
  const trace=String(r.source_trace_note||"")+" | v2.2:"+String(r.evidence_source_note||"");
  return{
    final_rank_by_cancer:r.final_v2_rank_by_cancer,
    drug_name:r.drug_name||"",
    v2_flags:(flags.trim()||"—"),
    canonical_drug_id:r.canonical_drug_id,
    drug_repurposing_category:v22,
    category_v2:v2c,
    category_v21:v21,
    category_v22:v22,
    allowlist_hit:String(r.current_use_allowlist_hit||""),
    same_cancer_badge:badge,
    final_priority_score:r.final_priority_score_v2,
    ev_composite_0_10:r.ev_composite_original,
    admet_tier:r.admet_tier,
    recommended_for_repurposing:r.recommended_for_repurposing,
    recommendation_reason:r.final_recommendation_status,
    key_ev_evidence_summary:trace,
    source_ensemble_method:r.source_ensemble_method
  };
}

function findBest(ck,mod,tk,ev){
  const models=M[ck]?.[mod];if(!models)return{n:null,sp:null};
  let best=null,bv=-Infinity;
  Object.entries(models).forEach(([n,ts])=>{
    if(n.includes("reference")||n.includes("surrogate"))return;
    const d=ts?.[tk]?.[ev];
    if(d&&d[0]!==null&&d[0]>bv){bv=d[0];best=n;}
  });
  return{n:best,sp:bv>-Infinity?bv:null};
}

    h+=`<tr class="${ib?"best":""}"><td class="${ib?"best-name":""}">${name}${isNull?' <span style="color:var(--mut)">(N/A)</span>':""}</td>`;

  const dcm=DC&&DC.groupcvV3DrugNameCuration&&DC.groupcvV3DrugNameCuration.displayNameByCancer;
  const sid=String(id||"").trim();
  const dnCur=(dcm&&dcm[P]&&dcm[P][sid])||(dcm&&dcm[P]&&dcm[P][id]);
  if(dnCur) return escPE(dnCur);
  const FR=window.GROUPCV_V3_FINAL_READINESS;
  const m=FR&&FR.groupcvV3FinalReadiness&&FR.groupcvV3FinalReadiness.displayNameByCancer&&FR.groupcvV3FinalReadiness.displayNameByCancer[P];
  const dn=m&&m[sid];
  if(dn) return escPE(dn);
  const n=String(rowName||"").trim();
  if(n) return escPE(n);
  return escPE("Drug:"+String(id));
}

function renderDrugRecommendationTab(selCancer){
  const B=(typeof window!=="undefined"&&window.STEP7_THREE_TIER_BUNDLE)||{};

  const dedupMap=new Map();
  rawRows.forEach(r=>{
    const key=String(r.drug_name||"").trim().toLowerCase();
    if(!key){
      dedupMap.set(`__empty__${dedupMap.size}`,r);
      return;
    }
    const prev=dedupMap.get(key);
    if(!prev||Number(r.final_rank_by_cancer)<Number(prev.final_rank_by_cancer)) dedupMap.set(key,r);
  });
  const rows=[...dedupMap.values()].sort((a,b)=>Number(a.final_rank_by_cancer)-Number(b.final_rank_by_cancer));

function renderStep7ThreeTierCard(){
  const B=(typeof window!=="undefined"&&window.STEP7_THREE_TIER_BUNDLE)||{};
  const rowsByCancer=B.rows_by_cancer||{};
  const sumByCancer=B.summary_by_cancer||{};
  const cancers=["BRCA","CRC","LUAD","STAD"];
  let sumRows="";
  cancers.forEach(ck=>{
    const sums=sumByCancer[ck]||[];
    let t1=0,t2=0,t3=0;
    sums.forEach(s=>{
      const code=String(s.repurposing_tier3_code||"");
      const n=Number(s.count||0);
      if(code==="tier1_current_use_same_cancer") t1=n;
      else if(code==="tier2_clinical_or_research_approved") t2=n;
      else if(code==="tier3_unused_repurposing_candidate") t3=n;
    });
    sumRows+=`<tr><td style="font-weight:700">${escPE(ck)}</td><td class="r">${t1}</td><td class="r">${t2}</td><td class="r">${t3}</td><td class="r">${t1+t2+t3}</td></tr>`;
  });
  let details="";
  cancers.forEach(ck=>{
    const rs=(rowsByCancer[ck]||[]).slice().sort((a,b)=>Number(a.final_rank_by_cancer)-Number(b.final_rank_by_cancer));
    let body="";
    rs.forEach(r=>{
      body+=`<tr><td class="r">${escPE(r.final_rank_by_cancer)}</td><td><b>${escPE(r.drug_name)}</b></td><td>${escPE(r.canonical_drug_id)}</td><td>${escPE(r.repurposing_tier3_ko)}</td><td style="font-family:monospace">${escPE(r.repurposing_tier3_rule)}</td></tr>`;
    });
    details+=`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">${escPE(ck)} Top15 3단계 분류 (${rs.length})</summary><div class="ov-table-wrap"><table class="ov-table"><thead><tr><th class="r">rank</th><th>drug</th><th>id</th><th>3단계 분류</th><th>rule</th></tr></thead><tbody>${body||"<tr><td colspan='5'>No rows</td></tr>"}</tbody></table></div></details>`;
  });
  return `<div class="card" style="border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.06)">
